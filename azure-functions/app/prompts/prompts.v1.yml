infer_heading_levels:
  template: |
    You assign the correct OUTLINE NESTING LEVEL to each section heading detected in a policy
    document, using the document's Table of Contents as the source of truth.

    You are given:
    1) The first part of the document, with each line shown at its real indentation. If it contains a
       Table of Contents, that TOC's INDENTATION shows the intended nesting depth: a line at the left
       margin is level 1, indented once beneath it is level 2, indented twice is level 3, and so on.
    2) The headings detected in the document body, in order. Each line is:
         index: [detected_by] title  (current_level N)

    For EACH detected heading, output its level (1 = top-level, 2 = subsection, 3 = sub-subsection,
    ...) and whether it is genuinely a heading:
    - If the document start contains a Table of Contents, find the heading in it and use that entry's
      indentation depth as the heading's level.
    - If a heading is NOT in the Table of Contents (or there is no TOC), infer its level from the
      nearby headings; keep its current_level if unsure.
    - Set "is_heading": false only for an entry that is clearly NOT a section heading (a stray
      bold/uppercase line, a defined term, a table/figure label).
    - Do NOT invent headings and do NOT change the titles.

    DOCUMENT START (if a Table of Contents appears here, its indentation = nesting depth):
    {document_start}

    DETECTED HEADINGS (index: [detected_by] title  (current_level N)):
    {headings}

    OUTPUT FORMAT - return ONLY valid JSON, no other text:
    {{
      "levels": [
        {{"index": 0, "level": 1, "is_heading": true}},
        {{"index": 1, "level": 2, "is_heading": true}}
      ]
    }}

summarize_document:
  name: "Summarize Policy Document for Semantic Search"
  version: 1.0
  template: |
    You are a helpful assistant who is an expert at analyzing legal and policy documents.
    Analyze the following document text and write a single, dense, and comprehensive paragraph that captures its core meaning, intent, and key topics. This summary will be used to create a vector embedding for semantic search.
    Focus on the most important themes, concepts, and implications of the text.
    Avoid unnecessary details or examples, and do not include any personal opinions or interpretations.

    TEXT:
    {text}
    
    COMPREHENSIVE SUMMARY:

generate_policy_content:
  name: "Generate Policy Content"
  version: 1.0
  template: |
    You are an AI assistant helping to generate policy content based on existing policy templates and user requirements.

    EXISTING POLICY CONTENT FOR REFERENCE:
    {topic_content}

    USER REQUEST:
    {user_query}

    Please generate improved or customized policy content that addresses the user's request while building upon the existing policy content provided above. 
    
    Ensure the response is:
    1. Professional and appropriate for policy documentation
    2. Consistent with the structure and tone of the existing content
    3. Responsive to the specific user request
    4. Clear and actionable
    5. Properly formatted with headers and bullet points where appropriate

    GENERATED POLICY CONTENT:

validate_draft_description:
  name: "Validate Draft Description"
  version: 1.0
  template: |
    You are an expert policy consultant evaluating whether a description is sufficient to create a meaningful policy document.

    DESCRIPTION TO EVALUATE:
    {description}

    Evaluate this description and determine if it provides enough detail and clarity to generate a useful policy document.

    Common BAD descriptions include:
    - "n/a", "none", "N/A", "not applicable"
    - "overall HR policy", "general policy", "company policy"
    - Single words or very vague phrases
    - Descriptions that don't specify what the policy should cover
    - Generic statements without any specific requirements

    GOOD descriptions should:
    - Clearly state what the policy needs to address
    - Mention specific areas, scenarios, or requirements
    - Provide enough context to generate targeted content
    - Be at least 15-20 words with meaningful content

    Return your assessment as a JSON object with this EXACT structure:
    {{
      "is_valid": true or false,
      "quality_score": number between 0 and 100,
      "issues": ["list", "of", "specific", "issues"] or [],
      "suggestions": ["list", "of", "improvement", "suggestions"] or [],
      "improved_description": "A rewritten version that would be acceptable" or null
    }}

    Important:
    - Set is_valid to FALSE if quality_score is below 50 (descriptions need at least 50 to be acceptable)
    - Quality score should be 0-20 for terrible descriptions, 20-50 for poor, 50-70 for acceptable, 70-100 for good
    - Set is_valid to false for descriptions like "n/a", "overall policy", or anything too vague
    - Always provide specific, actionable suggestions if the description needs improvement
    - Generate an improved_description if the current one scores below 60 to help users

    Return ONLY the JSON object, no additional text or explanation.

improve_draft_description:
  name: "Improve Draft Description"
  version: 1.0
  template: |
    You are an expert HR and policy consultant helping organizations create comprehensive policies.

    The user has provided a low-quality description for a policy document they want to create.
    Your task is to improve this description to be more specific, detailed, and actionable.

    ORIGINAL DESCRIPTION: {original_description}
    POLICY TITLE: {title}
    ORGANIZATION INDUSTRY: {industry}
    COMPANY NAME: {company_name}
    LOCATION: {city}, {country}

    Please create an improved description that:
    1. Is specific about what the policy should cover
    2. Mentions key areas and scenarios that should be addressed
    3. Is relevant to the {industry} industry
    4. Is at least 30-50 words long
    5. Provides clear direction for policy content generation
    6. Avoids generic statements like "overall policy" or "general guidelines"

    Write the improved description in a professional tone, as if the client wrote it themselves.
    Do not include any meta-commentary, just provide the improved description text.

    IMPROVED DESCRIPTION:

