    Provide suggestions that are:
    - Relevant to the document's purpose
    - Not duplicating existing topics
    - Specific and actionable
    - Appropriate for the {industry} industry
    - Compliant with {country} regulations and the specified regulations
    - Aligned with the detail level (light vs heavy approach)

    Return your suggestions as a JSON object with the following structure:
    {{
      "suggestions": [
        {{
          "type": "topic" or "subtopic",
          "title": "Suggested title",
          "description": "Brief explanation of why this is relevant",
          "parent_topic": "Name of parent topic if this is a subtopic suggestion",
          "proposed_position": "Where this might fit (e.g., 'after Security Policy', 'under Data Protection')",
          "subtopics": ["List of suggested subtopics if this is a topic"] // optional
        }}
      ],
      "rationale": "Overall explanation of why these suggestions are relevant",
      "additional_notes": "Any additional context or recommendations"
    }}

    JSON RESPONSE: