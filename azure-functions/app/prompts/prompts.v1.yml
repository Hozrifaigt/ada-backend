review_regulation:
  template: |
    You are a senior policy consultant performing the LAW / REGULATION check on ONE section of a client
    policy. You are given the section's current content and the regulation excerpts retrieved for it.

    Decide whether the retrieved regulations ACTUALLY apply to this section. Many sections have no relevant
    regulation — in that case say so and stop (do not invent obligations).

    SECTION BEING REVIEWED: {topic_title}

    DOCUMENT CONTEXT:
    Title: {document_title}
    Industry: {industry}

    SECTION'S CURRENT CONTENT:
    {existing_content}

    RETRIEVED REGULATION SECTIONS (may be empty or irrelevant):
    {regulations_context}

    INSTRUCTIONS:
    1. If none of the retrieved regulations genuinely govern this section, set "applies" to false and leave
       "extract" and "suggestion" empty. Do NOT stretch an unrelated regulation to fit.
    2. If a regulation does apply, set "applies" to true, put the SHORT verbatim regulation excerpt(s) that
       matter into "extract" (with article numbers), and in "suggestion" give the concrete text/clause the
       reviewer should embed into the section to be compliant. Cite exact article numbers — never invent them.

    OUTPUT FORMAT - return ONLY valid JSON, no other text:
    {{
      "applies": true,
      "extract": "verbatim regulation excerpt with article number(s), or empty",
      "suggestion": "concrete clause to embed into the section for compliance, or empty"
    }}

redistribute_content:
  template: |
    You are mapping the LEFTOVER pieces of a client's policy content into a NEW table of contents for a
    review. The obvious same-title matches were already assigned automatically — you only handle the harder
    cases below. The new TOC renamed, merged, split, and added sections, so match by MEANING.

    POLICY: {document_title}

    NEW SECTIONS (the target structure — assign content into these by index). Each line:
    "<index>: [topic|subtopic] (already filled?) <title>". "topic" is a main section; "subtopic" is a
    child of a topic. Sections marked "(already filled)" already received their primary content.
    {good_sections}

    CLIENT'S LEFTOVER CONTENT UNITS (each line: "<index>: [topic|subtopic] [suggested <section>] <title> — <snippet>"):
    The "suggested" number is a similarity hint from an embedding pre-filter; override it when the meaning
    clearly fits a different new section.
    {source_units}

    INSTRUCTIONS:
    1. Assign EACH leftover unit to the single NEW section it best belongs to, by meaning/topic.
    2. RESPECT LEVEL: a [topic] unit (a main section's own text) belongs in a [topic] section — do NOT put it
       inside a [subtopic]. A [subtopic] unit usually belongs in a [subtopic], or in its parent [topic] if no
       subtopic fits.
    3. Prefer a section that is NOT "(already filled)" when two sections fit equally well.
    4. If a unit does not belong to ANY new section, assign it section -1 (flagged as unassigned).
    5. Do not assign one unit to multiple sections. Every unit appears exactly once. Output ONLY indices.

    OUTPUT FORMAT - return ONLY valid JSON, no other text:
    {{
      "assignments": [
        {{"unit": 0, "section": 3}},
        {{"unit": 1, "section": -1}}
      ]
    }}

