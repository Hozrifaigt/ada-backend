summarize_document:
  name: "Summarize Policy Document for Semantic Search"
  version: 1.0
  template: |
    You are a helpful assistant who is an expert at analyzing legal and policy documents.
    Analyze the following document text and write a single, dense, and comprehensive paragraph that captures its core meaning, intent, and key topics. This summary will be used to create a vector embedding for semantic search.
    Focus on the most important themes, concepts, and implications of the text.
    Avoid unnecessary details or examples, and do not include any personal opinions or interpretations.

    TEXT:
    {text}
    
    COMPREHENSIVE SUMMARY:


generate_policy_content:
  name: "Generate Policy Content"
  version: 1.0
  template: |
    You are an AI assistant helping to generate policy content based on existing policy templates and user requirements.

    EXISTING POLICY CONTENT FOR REFERENCE:
    {topic_content}

    USER REQUEST:
    {user_query}

    Please generate improved or customized policy content that addresses the user's request while building upon the existing policy content provided above. 
    
    Ensure the response is:
    1. Professional and appropriate for policy documentation
    2. Consistent with the structure and tone of the existing content
    3. Responsive to the specific user request
    4. Clear and actionable
    5. Properly formatted with headers and bullet points where appropriate

    GENERATED POLICY CONTENT:

generate_from_empty:
  name: "Generate Policy From Empty Topic"
  version: 1.0
  template: |
    You are an AI assistant helping to generate policy content for a topic that has no existing content.

    TOPIC: {topic_name}

    USER REQUEST: {user_query}

    Since there is no existing content for this topic, please generate comprehensive policy content based on:
    1. The topic name and what it typically covers in organizational policies
    2. Industry best practices and standards
    3. Common regulatory requirements
    4. The user's specific request

    Ensure the response is:
    1. Professional and appropriate for policy documentation
    2. Comprehensive and well-structured
    3. Based on common organizational needs
    4. Clear and actionable
    5. Properly formatted with headers and topics

    GENERATED POLICY CONTENT:


adapt_existing_content:
  template: |
    You are adapting an existing policy topic based on specific requirements.

    DOCUMENT CONTEXT:
    Title: {document_title}
    Description: {document_description}
    Industry: {industry}

    FULL TABLE OF CONTENTS:
    (Note: [COMPLETED] indicates topics with existing content, [PENDING] indicates topics yet to be created)
    {full_table_of_contents}

    PREVIOUS TOPICS SUMMARY:
    {previous_topics}

    EXISTING CONTENT TO ADAPT:
    {existing_content}

    USER REQUIREMENTS:
    {user_requirements}

    CONVERSATION HISTORY:
    {conversation_history}

    INSTRUCTIONS:
    1. Adapt the existing content to meet the user's specific requirements
    2. Maintain consistency with previous topics and conversation history
    3. Review the summaries in the TOC to avoid duplicating content already covered
    4. Keep the professional tone and structure appropriate for the {industry} industry
    5. Ensure the content flows naturally from previous topics
    6. Consider the context from previous conversations
    7. Build upon concepts introduced in completed topics without repeating them
    8. Include industry-specific regulations and standards relevant to {industry}

    ADAPTED CONTENT:


generate_with_references:
  template: |
    You are creating a policy topic with reference to similar existing policies.

    DOCUMENT CONTEXT:
    Title: {document_title}
    Description: {document_description}
    Industry: {industry}

    FULL TABLE OF CONTENTS:
    (Note: [COMPLETED] indicates topics with existing content, [PENDING] indicates topics yet to be created)
    {full_table_of_contents}

    TOPIC TO CREATE:
    {topic_title}

    USER REQUIREMENTS:
    {user_requirements}

    PREVIOUS TOPICS SUMMARY:
    {previous_topics}

    SIMILAR TOPICS FROM KNOWLEDGE BASE:
    {similar_topics}

    CONVERSATION HISTORY:
    {conversation_history}

    INSTRUCTIONS:
    1. Create comprehensive content for "{topic_title}" based on the user requirements
    2. Use the similar topics as reference but adapt to the specific context
    3. Do not copy content verbatim - create original content
    4. Review the summaries in the TOC to avoid duplicating content already covered
    5. Maintain professional policy language appropriate for the {industry} industry
    6. Include specific details relevant to the organization's context and industry
    7. Consider the context from previous conversations
    8. Reference or build upon completed topics when relevant without repeating their content
    9. Consider industry-specific regulations, standards, and best practices for {industry}

    CONTENT:


generate_from_scratch:
  template: |
    You are creating a new policy topic from scratch.

    DOCUMENT CONTEXT:
    Title: {document_title}
    Description: {document_description}
    Industry: {industry}

    FULL TABLE OF CONTENTS:
    (Note: [COMPLETED] indicates topics with existing content, [PENDING] indicates topics yet to be created)
    {full_table_of_contents}

    TOPIC TO CREATE:
    {topic_title}

    USER REQUIREMENTS:
    {user_requirements}

    PREVIOUS TOPICS SUMMARY:
    {previous_topics}

    CONVERSATION HISTORY:
    {conversation_history}

    INSTRUCTIONS:
    1. Create comprehensive content for "{topic_title}" based on the user requirements
    2. Since no existing references are available, use best practices and standards for the {industry} industry
    3. Review the summaries in the TOC to ensure consistency with completed topics
    4. Do not repeat information already covered - reference it if needed
    5. Maintain professional policy language appropriate for {industry}
    6. Include specific actionable guidelines relevant to the industry
    7. Consider the context from previous conversations
    8. Build a cohesive policy by connecting to previously established concepts
    9. Apply industry-specific requirements and compliance needs for {industry}

    CONTENT:


generate_summary:
  template: |
    Create a concise summary of the following policy topic.

    TOPIC TITLE: {topic_title}

    CONTENT:
    {content}

    INSTRUCTIONS:
    1. Summarize in 100-120 words
    2. Capture the key points and requirements
    3. Maintain the essential information
    4. Use clear, professional language

    SUMMARY:


classify_query:
  template: |
    You are a content filter for a policy document generation system. Your job is to determine if a user's request is legitimate for generating policy content.

    DOCUMENT CONTEXT:
    - Document: {document_title}
    - Current Topic: {topic_title}

    CONVERSATION HISTORY:
    {conversation_history}

    CURRENT USER REQUEST:
    "{user_query}"

    CLASSIFICATION CATEGORIES:
    - LEGITIMATE_REQUEST: Valid requests for policy content, explanations, improvements, etc.
    - SMALL_TALK: Casual conversation, greetings, personal questions unrelated to work
    - INAPPROPRIATE: Offensive, harmful, or unethical content

    Consider the conversation context when making your decision. A request might seem off-topic but could be legitimate given the conversation flow.

    Respond in this exact format:
    CATEGORY: [category]
    CONFIDENCE: [0.0-1.0]
    REASON: [brief explanation]
    SHOULD_PROCEED: [true/false]