infer_heading_levels:
  template: |
    You assign the correct OUTLINE NESTING LEVEL to each section heading detected in a policy
    document, using the document's Table of Contents as the source of truth.

    You are given:
    1) The first part of the document, with each line shown at its real indentation. If it contains a
       Table of Contents, that TOC's INDENTATION shows the intended nesting depth: a line at the left
       margin is level 1, indented once beneath it is level 2, indented twice is level 3, and so on.
    2) The headings detected in the document body, in order. Each line is:
         index: [detected_by] title  (current_level N)

    For EACH detected heading, output its level (1 = top-level, 2 = subsection, 3 = sub-subsection,
    ...) and whether it is genuinely a heading:
    - If the document start contains a Table of Contents, find the heading in it and use that entry's
      indentation depth as the heading's level.
    - If a heading is NOT in the Table of Contents (or there is no TOC), infer its level from the
      nearby headings; keep its current_level if unsure.
    - Set "is_heading": false only for an entry that is clearly NOT a section heading (a stray
      bold/uppercase line, a defined term, a table/figure label).
    - Do NOT invent headings and do NOT change the titles.

    DOCUMENT START (if a Table of Contents appears here, its indentation = nesting depth):
    {document_start}

    DETECTED HEADINGS (index: [detected_by] title  (current_level N)):
    {headings}

    OUTPUT FORMAT - return ONLY valid JSON, no other text:
    {{
      "levels": [
        {{"index": 0, "level": 1, "is_heading": true}},
        {{"index": 1, "level": 2, "is_heading": true}}
      ]
    }}

summarize_document:
  name: "Summarize Policy Document for Semantic Search"
  version: 1.0
  template: |
    You are a helpful assistant who is an expert at analyzing legal and policy documents.
    Analyze the following document text and write a single, dense, and comprehensive paragraph that captures its core meaning, intent, and key topics. This summary will be used to create a vector embedding for semantic search.
    Focus on the most important themes, concepts, and implications of the text.
    Avoid unnecessary details or examples, and do not include any personal opinions or interpretations.

    TEXT:
    {text}
    
    COMPREHENSIVE SUMMARY:

generate_policy_content:
  name: "Generate Policy Content"
  version: 1.0
  template: |
    You are an AI assistant helping to generate policy content based on existing policy templates and user requirements.

    EXISTING POLICY CONTENT FOR REFERENCE:
    {topic_content}

    USER REQUEST:
    {user_query}

    Please generate improved or customized policy content that addresses the user's request while building upon the existing policy content provided above. 
    
    Ensure the response is:
    1. Professional and appropriate for policy documentation
    2. Consistent with the structure and tone of the existing content
    3. Responsive to the specific user request
    4. Clear and actionable
    5. Properly formatted with headers and bullet points where appropriate

    GENERATED POLICY CONTENT:

validate_draft_description:
  name: "Validate Draft Description"
  version: 1.0
  template: |
    You are an expert policy consultant evaluating whether a description is sufficient to create a meaningful policy document.

    DESCRIPTION TO EVALUATE:
    {description}

    Evaluate this description and determine if it provides enough detail and clarity to generate a useful policy document.

    Common BAD descriptions include:
    - "n/a", "none", "N/A", "not applicable"
    - "overall HR policy", "general policy", "company policy"
    - Single words or very vague phrases
    - Descriptions that don't specify what the policy should cover
    - Generic statements without any specific requirements

    GOOD descriptions should:
    - Clearly state what the policy needs to address
    - Mention specific areas, scenarios, or requirements
    - Provide enough context to generate targeted content
    - Be at least 15-20 words with meaningful content

    Return your assessment as a JSON object with this EXACT structure:
    {{
      "is_valid": true or false,
      "quality_score": number between 0 and 100,
      "issues": ["list", "of", "specific", "issues"] or [],
      "suggestions": ["list", "of", "improvement", "suggestions"] or [],
      "improved_description": "A rewritten version that would be acceptable" or null
    }}

    Important:
    - Set is_valid to FALSE if quality_score is below 50 (descriptions need at least 50 to be acceptable)
    - Quality score should be 0-20 for terrible descriptions, 20-50 for poor, 50-70 for acceptable, 70-100 for good
    - Set is_valid to false for descriptions like "n/a", "overall policy", or anything too vague
    - Always provide specific, actionable suggestions if the description needs improvement
    - Generate an improved_description if the current one scores below 60 to help users

    Return ONLY the JSON object, no additional text or explanation.

improve_draft_description:
  name: "Improve Draft Description"
  version: 1.0
  template: |
    You are an expert HR and policy consultant helping organizations create comprehensive policies.

    The user has provided a low-quality description for a policy document they want to create.
    Your task is to improve this description to be more specific, detailed, and actionable.

    ORIGINAL DESCRIPTION: {original_description}
    POLICY TITLE: {title}
    ORGANIZATION INDUSTRY: {industry}
    COMPANY NAME: {company_name}
    LOCATION: {city}, {country}

    Please create an improved description that:
    1. Is specific about what the policy should cover
    2. Mentions key areas and scenarios that should be addressed
    3. Is relevant to the {industry} industry
    4. Is at least 30-50 words long
    5. Provides clear direction for policy content generation
    6. Avoids generic statements like "overall policy" or "general guidelines"

    Write the improved description in a professional tone, as if the client wrote it themselves.
    Do not include any meta-commentary, just provide the improved description text.

    IMPROVED DESCRIPTION:

generate_from_empty:
  name: "Generate Policy From Empty Topic"
  version: 1.0
  template: |
    You are an AI assistant helping to generate policy content for a topic that has no existing content.

    TOPIC: {topic_name}

    USER REQUEST: {user_query}

    Since there is no existing content for this topic, please generate comprehensive policy content based on:
    1. The topic name and what it typically covers in organizational policies
    2. Industry best practices and standards
    3. Common regulatory requirements
    4. The user's specific request

    Ensure the response is:
    1. Professional and appropriate for policy documentation
    2. Comprehensive and well-structured
    3. Based on common organizational needs
    4. Clear and actionable
    5. Properly formatted with headers and topics

    GENERATED POLICY CONTENT:

adapt_existing_content:
  template: |
    You are adapting an existing policy topic based on specific requirements.

    DOCUMENT CONTEXT:
    Title: {document_title}
    Description: {document_description}
    Function: {function}
    Industry: {industry}
    Client-Specific Requests: {client_specific_requests}
    Sector-Specific Comments: {sector_specific_comments}
    Applicable Regulations: {regulations}
    Detail Level: {detail_level}

    DETAIL LEVEL GUIDANCE:
    Based on the detail level specified, follow this philosophy:

    | Concept | Light (1-2) | Moderate (3) | Heavy (4-5) |
    |---------|-------------|--------------|-------------|
    | Philosophy | Trust & Empowerment | Balanced Approach | Control & Compliance |
    | Focus | Why (Outcomes & Principles) | Mix of Why and How | How (Procedures & Rules) |
    | Style | Short, high-level | Moderate detail | Long, granular, step-by-step |
    | Guidance | Assumes employee judgment | Some guidance with flexibility | Explicit, detailed direction |
    | Content | Principles and guidelines | Key procedures with rationale | Comprehensive rules and workflows |

    Apply the detail level ({detail_level}) to determine:
    - How prescriptive vs principle-based the content should be
    - The length and granularity of procedures
    - The balance between "what" and "how"
    - The level of specific examples and scenarios to include

    FULL TABLE OF CONTENTS:
    (Note: [COMPLETED] indicates topics with existing content, [PENDING] indicates topics yet to be created)
    {full_table_of_contents}

    PREVIOUS TOPICS SUMMARY:
    {previous_topics}

    RELEVANT REGULATION SECTIONS:
    {regulations_context}

    CRITICAL INSTRUCTIONS FOR REGULATION CITATIONS:
    1. When referencing regulations, use INLINE CITATIONS with article numbers (e.g., "According to Article 15 of Federal Decree-Law No. 33 of 2021, ...")
    2. ONLY cite regulations provided in the RELEVANT REGULATION SECTIONS above - do not make up article numbers
    3. If multiple articles apply, cite all relevant ones
    4. Ensure accuracy - article numbers must match the provided sections exactly
    5. If no relevant regulation sections are found above, proceed with industry best practices without regulation citations

    EXISTING CONTENT TO ADAPT:
    {existing_content}

    USER REQUIREMENTS:
    {user_requirements}

    CONVERSATION HISTORY:
    {conversation_history}

    INSTRUCTIONS:
    1. Adapt the existing content to meet the user's specific requirements
    2. Maintain consistency with previous topics and conversation history
    3. Review the summaries in the TOC to avoid duplicating content already covered
    4. Keep the professional tone and structure appropriate for the {industry} industry
    5. Ensure the content flows naturally from previous topics
    6. Consider the context from previous conversations
    7. Build upon concepts introduced in completed topics without repeating them
    8. Include industry-specific regulations and standards relevant to {industry}
    9. IMPORTANT: Ensure all content complies with the applicable regulations: {regulations}
    10. IMPORTANT: When regulation sections are provided, cite them using inline citations as specified above
    11. IMPORTANT: Address the client-specific requests: {client_specific_requests}
    12. IMPORTANT: If sector-specific comments are provided, incorporate them: {sector_specific_comments}
    13. IMPORTANT: Follow the detail level specification ({detail_level}) as outlined in the guidance table above

    ADAPTED CONTENT:

policy_consistency:
  template: |
    You are a senior policy reviewer doing a WHOLE-DOCUMENT consistency pass on a policy.
    Read the full policy below and find issues that are only visible across sections:
    - "contradiction": two sections state conflicting rules/values.
    - "terminology": the same concept is named inconsistently across sections.
    - "duplicate": the same clause/requirement is repeated in multiple sections.
    - "undefined_term": a term is used but never defined.
    - "cross_reference": a section refers to another that is missing or mislabeled.

    Only report genuine, specific issues. Cite the section titles involved in "locations".

    POLICY: {document_title}
    INDUSTRY: {industry}

    FULL POLICY (sections with ## / ### headings):
    {policy_text}

    OUTPUT FORMAT - return ONLY valid JSON, no other text:
    {{
      "issues": [
        {{"type": "contradiction", "severity": "high", "description": "...", "locations": ["1. Title", "4. Title"], "suggestion": "..."}}
      ],
      "summary": "One or two sentences on overall consistency."
    }}

gap_summary_narrative:
  template: |
    You are a senior policy consultant writing the executive summary of a policy GAP-ASSESSMENT REVIEW
    for the client. Write 2-4 short paragraphs, professional and factual, summarizing what the review
    covered, the main gaps addressed (by theme/severity), regulation alignment, and that the client's
    baseline was largely preserved. Do not invent numbers beyond those given.

    POLICY: {document_title}
    INDUSTRY: {industry}

    ROLLUP (facts you may cite):
    {rollup}

    PER-SECTION HIGHLIGHTS:
    {highlights}

    Return ONLY the narrative prose (no headings, no JSON).

consolidate_theme:
  template: |
    You are a senior policy consultant CONSOLIDATING a single section of a client policy.
    The client's content for this theme is currently scattered across the policy. Your job is to gather
    everything in the WHOLE policy that belongs to this section's theme, bring it together here, align it
    to the good-standard benchmark, and return one clean consolidated draft for THIS section only.

    SECTION (theme) BEING CONSOLIDATED: {topic_title}

    DOCUMENT CONTEXT:
    Title: {document_title}
    Industry: {industry}
    Detail Level: {detail_level}

    THIS SECTION'S CURRENT CONTENT (the baseline to preserve where adequate):
    {existing_content}

    THE WHOLE CLIENT POLICY (scan ALL sections; pull anything about "{topic_title}" into this section):
    {whole_policy_text}

    GOOD-STANDARD BENCHMARK CONTENT FOR THIS THEME (reference only; do not copy verbatim):
    {benchmark_content}

    APPLICABLE REGULATION SECTIONS (may be empty):
    {regulations_context}

    INSTRUCTIONS:
    1. Pull every relevant point about this theme from anywhere in the policy into one coherent section.
    2. Preserve the client's own wording where it is adequate; do not rewrite compliant content.
    3. Do NOT invent content — only consolidate what exists in the policy, plus clearly-needed benchmark/
       regulation points.
    4. Return the FULL consolidated section content as prose (no headings, no JSON, no commentary).

    CONSOLIDATED CONTENT:

toc_from_text:
  template: |
    You are parsing a Table of Contents that a consultant pasted or described in free text, into a clean
    structured TOC for a policy review. Use the pasted text as the intended structure.

    PASTED TOC / INSTRUCTIONS:
    {pasted_text}

    CURRENT WORKING TOC (for reference; the consultant may want to adapt toward the pasted one):
    {current_toc}

    INSTRUCTIONS:
    1. Produce the ordered list of top-level topics described by the pasted text.
    2. Each topic may have subtopics (sub-sections). Keep titles concise and faithful to the pasted text.
    3. Do not invent sections the pasted text does not imply.

    OUTPUT FORMAT - return ONLY valid JSON, no other text:
    {{
      "toc": [
        {{"title": "Topic title", "subtopics": ["Subtopic title", "..."]}}
      ]
    }}

reconcile_toc:
  template: |
    You are a senior policy consultant deciding the final Table of Contents for a CLIENT POLICY REVIEW.
    You are reviewing the client's existing policy against a good-standard benchmark - NOT writing from scratch.
    First understand the policy's PURPOSE from its title, function and industry, and the client's CURRENT
    structure. Then produce the strongest Table of Contents for it: keep the client's sections, merge clear
    overlaps into one, and ADD the benchmark sections that fill genuine gaps. The result should reflect the
    client's policy improved toward the benchmark - not an unchanged copy, and not a rewrite from scratch.

    POLICY CONTEXT:
    Title: {title}
    Function: {function}
    Industry: {industry}
    Applicable Regulations: {regulations}
    Client-Specific Requests: {client_specific_requests}
    Sector-Specific Comments: {sector_specific_comments}
    Detail Level: {detail_level}

    REVIEW INTENSITY: {review_intensity}
    - "preserve" (DEFAULT): The client must still recognize their own policy. KEEP every client topic.
      Only ADD benchmark sections that are genuinely missing. You may merge clear duplicates and lightly
      rename for clarity, but never drop a client topic and never restructure aggressively. Aim to change
      no more than ~40-50% of the structure.
    - "rebuild": The client policy is weak or light and we have agreed to change most of it. You may freely
      restructure toward the benchmark good-standard, including dropping, splitting, or merging client topics.

    CLIENT POLICY TOPICS (the baseline; title + a short content snippet each):
    {client_topics}

    GOOD-STANDARD BENCHMARK TOPICS (reference for what a strong policy covers):
    {benchmark_topics}

    SEMANTIC SIMILARITY HINTS (computed from the topics' CONTENT, not just their titles — each pair below
    looks like the SAME section even though the titles differ; may say "None"):
    {similarity_hints}

    INSTRUCTIONS:
    1. Produce the final ordered list of topics for this policy review, honoring the REVIEW INTENSITY above.
    1b. Use the SEMANTIC SIMILARITY HINTS: when a benchmark topic is flagged as similar to a client topic,
       they are the SAME section. Output ONE entry for the pair with "source":"both", "client_match" set to
       that client topic's exact title, and "benchmark_match" set to the benchmark topic. Do NOT ALSO add
       the benchmark topic as a separate new section — that would duplicate a section the client already has.
    1c. ADD WHAT'S MISSING; DON'T DUPLICATE WHAT'S THERE. This review must surface real gaps, so when a
       benchmark topic covers something the client policy genuinely LACKS, ADD it as a new section
       ("source":"benchmark"). Do NOT suppress genuinely-missing benchmark sections — a Good TOC that is an
       exact copy of the client's is wrong when the benchmark covers more. BUT when a benchmark topic clearly
       corresponds to an existing client section (same subject, even under a different title — use the
       SIMILARITY HINTS), represent it EXACTLY ONCE as that client section ("source":"both", client_match set);
       never output both a client entry and a separate benchmark entry for the same subject. Merging two
       sections into one is fine — just make sure the merged subject appears once, never twice.
    1d. SUBTOPICS: both lists show each topic's subtopics as indented "(subtopic)" bullets. When the
       benchmark section a final topic maps to has subtopics that the client section LACKS, list those
       missing benchmark subtopic titles (verbatim from the benchmark list) in that entry's "add_subtopics".
       A "benchmark"-source added section automatically receives its own benchmark subtopics, so only use
       "add_subtopics" there for extra subtopics taken from a DIFFERENT benchmark section. Never invent a
       subtopic title that is not in the benchmark list, and never repeat a subtopic the client already has.
    2. CRITICAL — do NOT invent sections. Every final topic MUST come from the CLIENT POLICY TOPICS or the
       GOOD-STANDARD BENCHMARK TOPICS listed above. Reuse the EXACT title from one of those lists (you may
       lightly rename a CLIENT topic for clarity, but a "benchmark"/"both" topic's title must match a real
       benchmark topic). Never output a title that appears in neither list.
    3. For each final topic record where it came from and how it maps to the benchmark:
       - "title": the final topic title (verbatim from the client or benchmark list, per rule 2)
       - "source": "client" (from the client policy), "benchmark" (added because the client lacked it), or "both" (a client topic that also maps to a benchmark section)
       - "client_match": the exact client topic title it is based on, or null
       - "benchmark_match": the exact benchmark topic title it maps to, or null
       - "add_subtopics": missing benchmark subtopic titles to add under this topic (per rule 1d; else [])
       - "note": a SHORT rationale only when you merged, renamed, or added something (else "")
    4. Also judge the overall client policy: is it weak/light enough that a heavier rebuild would help?

    OUTPUT FORMAT - return ONLY valid JSON, no other text:
    {{
      "final_toc": [
        {{"title": "...", "source": "client", "client_match": "...", "benchmark_match": null, "add_subtopics": [], "note": ""}}
      ],
      "assessment": {{"weak": false, "summary": "One sentence; if weak, say which areas and that Rebuild may help."}}
    }}

extract_toc:
  template: |
    You are extracting the printed Table of Contents from the opening pages of a policy document.

    WHAT YOU ARE GIVEN (first pages, one line per paragraph; a printed "Table of Contents" /
    "Contents" list, if present, appears here - possibly indented to depth):
    ---
    {document_excerpt}
    ---

    HOW TO READ THE NUMBERING (important - schemes vary and are often MIXED in one document):
    - Section labels come in many styles: Arabic (1, 2, 3), letters (A, B, C), Roman numerals
      (I, II, III, IV, V), or dotted decimals (1, 1.1, 1.1.1). Indentation may also signal depth.
    - Depth ("level") comes from the section LABEL, not from how far down the page a line sits.
      A top-level marker (e.g. "A.", "B.", "1.", "2.", or a word like "Appendices") begins a
      level-1 section; the labels that FOLLOW it and restart (e.g. "I.", "II.", "III.") are its
      level-2 children. When the next top-level marker appears, the child numbering resets again.
    - Dotted decimals map directly: "1" -> level 1, "1.1" -> level 2, "1.1.1" -> level 3.
    - IGNORE a leading counter that simply increments by one on EVERY line down the whole list
      (1, 2, 3, ... regardless of nesting) - that is an auto-generated list counter, not a section
      number. Use the NEXT label on the line to decide the level.

    INSTRUCTIONS:
    1. ONLY act if the excerpt contains an actual printed "Table of Contents" / "Contents" list.
       Otherwise return {{"source": "none", "toc": []}} and nothing else - never infer a structure
       from body prose or headings.
    2. Copy each title VERBATIM (same words, same order). Do NOT paraphrase, translate, or invent.
       Strip ONLY: the auto-generated leading counter (above), trailing page numbers, and dot
       leaders. KEEP the section's own label (e.g. "I. Policy Objective").
    3. Assign "level" per HOW TO READ THE NUMBERING above.
    4. Do NOT include the "Table of Contents" header line, cover-page text, headers/footers, or
       bare page numbers as entries. Preserve document order.

    EXAMPLES (input -> output):

    Example 1 - dotted decimals:
    1. Introduction
    1.1 Purpose
    1.2 Scope
    2. Governance
    ->
    {{"source": "printed_toc", "toc": [
      {{"title": "1. Introduction", "level": 1}},
      {{"title": "1.1 Purpose", "level": 2}},
      {{"title": "1.2 Scope", "level": 2}},
      {{"title": "2. Governance", "level": 1}}
    ]}}

    Example 2 - MIXED letters / Arabic / Roman, with an auto counter to ignore:
    1. A. Abbreviations and Acronyms
    2. B. Introduction, Purpose, and Scope
    3. C. Accounting Assumptions and Quality Characteristics
    4. I. Accounting Assumptions and Concepts
    5. II. Quality Characteristics
    7. 1. Property, Plant, and Equipment (PPE)
    8. I. Policy Objective
    9. II. Scope
    69. Appendices
    70. I. Appendix I - Glossary Items
    ->
    {{"source": "printed_toc", "toc": [
      {{"title": "A. Abbreviations and Acronyms", "level": 1}},
      {{"title": "B. Introduction, Purpose, and Scope", "level": 1}},
      {{"title": "C. Accounting Assumptions and Quality Characteristics", "level": 1}},
      {{"title": "I. Accounting Assumptions and Concepts", "level": 2}},
      {{"title": "II. Quality Characteristics", "level": 2}},
      {{"title": "1. Property, Plant, and Equipment (PPE)", "level": 1}},
      {{"title": "I. Policy Objective", "level": 2}},
      {{"title": "II. Scope", "level": 2}},
      {{"title": "Appendices", "level": 1}},
      {{"title": "I. Appendix I - Glossary Items", "level": 2}}
    ]}}

    Example 3 - no contents list (prose only):
    Company Overview
    This document sets out our approach to ...
    ->
    {{"source": "none", "toc": []}}

    OUTPUT FORMAT - return ONLY valid JSON, no other text:
    {{"source": "printed_toc", "toc": [{{"title": "...", "level": 1}}]}}
    Use "source": "printed_toc" ONLY when you extracted a real printed contents list; otherwise
    {{"source": "none", "toc": []}}.

gap_assessment:
  template: |
    You are a senior policy reviewer performing a GAP ASSESSMENT of a client's existing policy topic.

    Your job is NOT to rewrite the policy. It is to identify, for this ONE topic, what is:
    - MISSING compared to the good-standard benchmark,
    - NON-COMPLIANT with the applicable regulations, or
    - a clear ENHANCEMENT opportunity (sub-par practice).

    CRITICAL PHILOSOPHY - PRESERVE THE CLIENT'S BASELINE:
    The client must still recognize their own policy. Do NOT flag content that is already adequate and compliant.
    Only report genuine gaps. Aim to change no more than ~40-50% of the baseline; flag more only if the topic is
    genuinely weak, light, or non-compliant.

    TOPIC BEING ASSESSED: {topic_title}

    DOCUMENT CONTEXT:
    Title: {document_title}
    Industry: {industry}
    Client-Specific Requests: {client_specific_requests}
    Sector-Specific Comments: {sector_specific_comments}
    Detail Level: {detail_level}

    CLIENT'S EXISTING CONTENT (the BASELINE to preserve):
    {existing_content}

    GOOD-STANDARD BENCHMARK CONTENT (reference for good practice; may say "None available"):
    {benchmark_content}

    APPLICABLE REGULATION SECTIONS (mandatory compliance; may be empty):
    {regulations_context}

    PREVIOUS CLIENT POLICY EXCERPT (for continuity; may be empty):
    {previous_policy_excerpt}

    ALREADY COVERED ELSEWHERE IN THE POLICY (read-only context; may say "None"):
    The blocks below are the parent-topic intro, sibling subsections, AND a map of the OTHER sections of
    the SAME client policy (titles + brief snippets). They are NOT being assessed here. Treat them only as
    context: if a point is already covered in ANY of them, it is NOT a gap — do not flag it as missing.
    {surrounding_context}

    INSTRUCTIONS:
    1. Compare the client's existing content against the benchmark and regulations.
    2. Produce a list of findings. Each finding must be specific and actionable.
    3. For each finding provide:
       - "type": one of "missing", "non_compliant", "enhancement"
       - "source": one of "benchmark", "regulation", "previous"
       - "severity": one of "high", "medium", "low" (regulation non-compliance is usually high)
       - "description": what the gap is, in one or two sentences
       - "suggested_change": the concrete change to apply to the client's content
       - "evidence": a SHORT verbatim quote from the benchmark or regulation text above that proves this
         gap is real. REQUIRED for "missing" and "non_compliant" findings. If you cannot quote supporting
         text from the benchmark/regulation provided, DO NOT output the finding (do not invent gaps).
       - "evidence_source": where the quote came from (e.g. benchmark section name, or regulation article number)
    4. If the existing content is already strong and compliant, return an empty findings list.
    5. Do NOT suggest rewriting compliant, adequate content.
    6. Do NOT flag something as missing or suggest adding it if it is already covered ANYWHERE in the
       "ALREADY COVERED ELSEWHERE IN THE POLICY" context above — assess ONLY the target content, but never
       re-flag a point that another section already handles.
    7. Stay within this topic's scope: only report gaps that genuinely belong to "{topic_title}". Do not
       map a benchmark point about a different process onto this topic.

    OUTPUT FORMAT - return ONLY valid JSON, no other text:
    {{
      "findings": [
        {{"type": "missing", "source": "benchmark", "severity": "medium", "description": "...", "suggested_change": "...", "evidence": "verbatim quote from benchmark/regulation", "evidence_source": "benchmark section / regulation article"}}
      ],
      "overall_summary": "One or two sentences summarizing the gaps for this topic."
    }}

adapt_with_gap:
  template: |
    You are revising a client's existing policy topic by applying ONLY a set of confirmed gap changes.

    DOCUMENT CONTEXT:
    Title: {document_title}
    Description: {document_description}
    Function: {function}
    Industry: {industry}
    Client-Specific Requests: {client_specific_requests}
    Sector-Specific Comments: {sector_specific_comments}
    Applicable Regulations: {regulations}
    Detail Level: {detail_level}

    DETAIL LEVEL GUIDANCE:
    Based on the detail level specified, follow this philosophy:

    | Concept | Light (1-2) | Moderate (3) | Heavy (4-5) |
    |---------|-------------|--------------|-------------|
    | Philosophy | Trust & Empowerment | Balanced Approach | Control & Compliance |
    | Focus | Why (Outcomes & Principles) | Mix of Why and How | How (Procedures & Rules) |
    | Style | Short, high-level | Moderate detail | Long, granular, step-by-step |

    Apply the detail level ({detail_level}) to determine prescriptiveness, length, and granularity.

    FULL TABLE OF CONTENTS (CONTEXT ONLY — never reproduce any of this in your output):
    (The [COMPLETED]/[PENDING]/[Brief]/[Content] markers are for your awareness only; they are NOT part of any
    section's content and must never appear in your answer.)
    {full_table_of_contents}

    PREVIOUS TOPICS SUMMARY (context only — do not reproduce):
    {previous_topics}

    RELEVANT REGULATION SECTIONS:
    {regulations_context}

    GOOD-STANDARD BENCHMARK CONTENT (reference only - do not copy verbatim):
    {benchmark_content}

    CLIENT'S EXISTING CONTENT (the BASELINE - preserve as much as possible):
    {existing_content}

    CONFIRMED GAP CHANGES TO APPLY (apply ONLY these):
    {confirmed_findings}

    REVIEW INTENSITY: {review_intensity}
    - "preserve" (DEFAULT): keep >=50-60% of the client's original wording. Change no more than ~40-50% of the
      baseline. Touch only the sentences targeted by a confirmed change; leave everything else verbatim.
    - "rebuild": the policy is weak/light and we agreed to change most of it; you may rewrite this topic broadly
      to a strong standard while still applying the confirmed changes.

    CRITICAL INSTRUCTIONS:
    1. PRESERVE the client's existing baseline content per the REVIEW INTENSITY above. The client must still recognize their own policy (especially in "preserve").
    2. Apply ONLY the confirmed gap changes listed above. In "preserve", do not rewrite sentences that are not targeted by a confirmed change.
    3. Do NOT introduce changes that were not confirmed, even if you notice other potential improvements.
    4. When a change cites a regulation, use inline citations with the EXACT article numbers from the regulation sections above. Do not invent article numbers.
    5. Keep the professional tone and structure appropriate for the {industry} industry.
    6. Follow the detail level specification ({detail_level}).
    7. SCOPE — output the revised content for THIS ONE section ONLY (the baseline with the confirmed changes
       applied). This is a single section of a larger policy, NOT the whole document.
    8. Do NOT reproduce the table of contents or any other section. Do NOT output the document title, the
       section numbers/headings of other sections, or any "[COMPLETED]" / "[PENDING]" / "[Brief]" / "[Content]"
       markers — those were given to you only as context.
    9. Do NOT add any preamble, explanation, or closing remarks (e.g. "Below is the revised content…",
       "All other sections remain unchanged…"). Begin directly with the section's content and stop when it ends.

    REVISED CONTENT FOR THIS SECTION ONLY (prose, no TOC, no markers, no commentary):

