name: Deploy to Azure Function App - Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated to v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd azure-functions
          python -m pip install --upgrade pip
          # Note: Flex Consumption prefers a standard pip install if doing remote build,
          # but for a zip deploy, we'll keep your structure or use the action's default.
          pip install -r requirements.txt

      - name: 'Run Azure Functions Action'
        uses: azure/functions-action@v1
        with:
          app-name: 'ada-backend-prod'
          # This action handles the zip and deployment logic specifically for Azure
          package: './azure-functions' 
          scm-do-build-during-deployment: true
          enable-oryx-build: true