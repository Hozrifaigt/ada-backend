name: Deploy to Azure Function App - Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # REQUIRED: Func CLI needs Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Azure Functions Core Tools v4
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (CORRECT PATH STRUCTURE)
        run: |
          cd azure-functions
          python -m pip install --upgrade pip
          # Critical: Include python3.11 in path
          pip install -r requirements.txt --target=".python_packages/lib/python3.11/site-packages"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}

      - name: Deploy with Func CLI (FLEX CONSUMPTION REQUIRED)
        run: |
          cd azure-functions
          # --no-build: Use pre-installed deps | --force: Overwrite
          func azure functionapp publish ada-backend-prod --python --no-build --force

      - name: Verify Deployment
        run: |
          echo "✅ Deployment completed to PROD: ada-backend-prod"
          echo "ℹ️ Check logs in Azure Portal if functions don't trigger"