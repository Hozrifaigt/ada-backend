name: Deploy to Azure Function App - Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Optional: Verify dependencies install correctly
      - name: Verify dependencies
        run: |
          cd azure-functions
          pip install -r requirements.txt --dry-run 2>/dev/null || echo "Note: --dry-run not supported, skipping"

      # CRITICAL: Create clean deployment package (NO local dependencies)
      - name: Create deployment package
        run: |
          cd azure-functions
          # Only source code, requirements.txt, and config files
          # Azure will install dependencies remotely via Oryx
          zip -r ../deploy.zip . \
            -x "*.git*" \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x ".env*" \
            -x "local.settings.json" \
            -x ".python_packages/*" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x "*.md" \
            -x ".vscode/*" \
            -x ".idea/*"

      - name: Deploy to Azure Function App (Remote Build)
        uses: Azure/functions-action@v1
        with:
          app-name: ada-backend-prod
          package: ./deploy.zip
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_PROD }}
          remote-build: true
          sku: flexconsumption

      - name: Verify Deployment
        run: |
          echo "✅ Deployment completed to PROD: ada-backend-prod"
          echo "ℹ️ Check 'Deployment Center' in Azure Portal for build logs"