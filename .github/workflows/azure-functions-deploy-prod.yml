name: Deploy to Azure Function App - Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd azure-functions
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Create deployment package
        run: |
          cd azure-functions
          zip -r ../deploy.zip . -x "*.git*"

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}

      - name: Deploy to Azure Function App
        run: |
          az functionapp deploy --resource-group ${{ secrets.AZURE_RESOURCE_GROUP_PROD }} --name ada-backend-prod --src-path deploy.zip --type zip

      - name: Deployment Summary
        run: |
          echo "✅ Deployed to PROD: ada-backend-prod"
