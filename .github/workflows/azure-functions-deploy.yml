name: Deploy to Azure Function App

on:
  push:
    branches:
      - main      # Triggers production deployment
      - develop   # Triggers dev deployment
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.ref == 'refs/heads/main' && 'prod') || (github.ref == 'refs/heads/develop' && 'dev') || github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd azure-functions
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Deploy to Azure Function App (Dev)
        if: github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'dev'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME_DEV }}
          package: './azure-functions'
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_DEV }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true

      - name: Deploy to Azure Function App (Prod)
        if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'prod'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME_PROD }}
          package: './azure-functions'
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_PROD }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true

      - name: Deployment Summary
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.event.inputs.environment }}" == "prod" ]; then
            echo "✅ Deployed to PRODUCTION: ${{ secrets.AZURE_FUNCTIONAPP_NAME_PROD }}"
          else
            echo "✅ Deployed to DEV: ${{ secrets.AZURE_FUNCTIONAPP_NAME_DEV }}"
          fi
