name: Deploy to Azure Function App

on:
  push:
    branches:
      - dev   # Triggers dev deployment
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd azure-functions
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Wait for any running deployments
        run: |
          echo "Waiting 30 seconds to avoid deployment conflicts..."
          sleep 30

      - name: Deploy to Azure Function App (Attempt 1)
        id: deploy1
        continue-on-error: true
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME_DEV }}
          package: './azure-functions'
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_DEV }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true
          respect-funcignore: true

      - name: Retry Deployment if Failed
        if: steps.deploy1.outcome == 'failure'
        run: |
          echo "First deployment attempt failed. Waiting 60 seconds before retry..."
          sleep 60

      - name: Deploy to Azure Function App (Attempt 2)
        if: steps.deploy1.outcome == 'failure'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME_DEV }}
          package: './azure-functions'
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_DEV }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true
          respect-funcignore: true

      - name: Deployment Summary
        run: |
          echo "✅ Deployed to DEV: ${{ secrets.AZURE_FUNCTIONAPP_NAME_DEV }}"
