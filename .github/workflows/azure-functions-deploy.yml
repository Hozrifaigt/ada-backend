name: Deploy to Azure Function App

on:
  push:
    branches:
      - dev   # Triggers dev deployment
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Prepare deployment package
        run: |
          # Copy the app folder into azure-functions directory
          cp -r app azure-functions/

          # Copy any other needed files
          cp requirements.txt azure-functions/

          # Navigate to azure-functions and install dependencies
          cd azure-functions
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"
          pip install azure-functions --target=".python_packages/lib/site-packages"

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME_DEV }}
          package: './azure-functions'
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_DEV }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true

      - name: Deployment Summary
        run: |
          echo "✅ Deployed to DEV: ${{ secrets.AZURE_FUNCTIONAPP_NAME_DEV }}"
