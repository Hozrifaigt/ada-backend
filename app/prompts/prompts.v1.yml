summarize_document:
  name: "Summarize Policy Document for Semantic Search"
  version: 1.0
  template: |
    You are a helpful assistant who is an expert at analyzing legal and policy documents.
    Analyze the following document text and write a single, dense, and comprehensive paragraph that captures its core meaning, intent, and key topics. This summary will be used to create a vector embedding for semantic search.
    Focus on the most important themes, concepts, and implications of the text.
    Avoid unnecessary details or examples, and do not include any personal opinions or interpretations.

    TEXT:
    {text}
    
    COMPREHENSIVE SUMMARY:


generate_policy_content:
  name: "Generate Policy Content"
  version: 1.0
  template: |
    You are an AI assistant helping to generate policy content based on existing policy templates and user requirements.

    EXISTING POLICY CONTENT FOR REFERENCE:
    {topic_content}

    USER REQUEST:
    {user_query}

    Please generate improved or customized policy content that addresses the user's request while building upon the existing policy content provided above. 
    
    Ensure the response is:
    1. Professional and appropriate for policy documentation
    2. Consistent with the structure and tone of the existing content
    3. Responsive to the specific user request
    4. Clear and actionable
    5. Properly formatted with headers and bullet points where appropriate

    GENERATED POLICY CONTENT:

generate_from_empty:
  name: "Generate Policy From Empty Topic"
  version: 1.0
  template: |
    You are an AI assistant helping to generate policy content for a topic that has no existing content.

    TOPIC: {topic_name}

    USER REQUEST: {user_query}

    Since there is no existing content for this topic, please generate comprehensive policy content based on:
    1. The topic name and what it typically covers in organizational policies
    2. Industry best practices and standards
    3. Common regulatory requirements
    4. The user's specific request

    Ensure the response is:
    1. Professional and appropriate for policy documentation
    2. Comprehensive and well-structured
    3. Based on common organizational needs
    4. Clear and actionable
    5. Properly formatted with headers and topics

    GENERATED POLICY CONTENT:


adapt_existing_content:
  template: |
    You are adapting an existing policy topic based on specific requirements.

    DOCUMENT CONTEXT:
    Title: {document_title}
    Description: {document_description}

    PREVIOUS TOPICS SUMMARY:
    {previous_topics}

    EXISTING CONTENT TO ADAPT:
    {existing_content}

    USER REQUIREMENTS:
    {user_requirements}

    CONVERSATION HISTORY:
    {conversation_history}

    INSTRUCTIONS:
    1. Adapt the existing content to meet the user's specific requirements
    2. Maintain consistency with previous topics and conversation history
    3. Do not repeat information already covered
    4. Keep the professional tone and structure
    5. Ensure the content flows naturally from previous topics
    6. Consider the context from previous conversations

    ADAPTED CONTENT:


generate_with_references:
  template: |
    You are creating a policy topic with reference to similar existing policies.

    DOCUMENT CONTEXT:
    Title: {document_title}
    Description: {document_description}

    TOPIC TO CREATE:
    {topic_title}

    USER REQUIREMENTS:
    {user_requirements}

    PREVIOUS TOPICS SUMMARY:
    {previous_topics}

    SIMILAR TOPICS FROM KNOWLEDGE BASE:
    {similar_topics}

    CONVERSATION HISTORY:
    {conversation_history}

    INSTRUCTIONS:
    1. Create comprehensive content for "{topic_title}" based on the user requirements
    2. Use the similar topics as reference but adapt to the specific context
    3. Do not copy content verbatim - create original content
    4. Ensure no repetition of information from previous topics
    5. Maintain professional policy language and structure
    6. Include specific details relevant to the organization's context
    7. Consider the context from previous conversations

    CONTENT:


