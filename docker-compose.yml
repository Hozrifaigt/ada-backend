services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ada_qdrant
    ports:
      - "6333:6333"
      - "6334:6334" 
    networks:
      - policy_network
    volumes:
      - ./data/qdrant_storage:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: ada_ollama
    ports:
      - "11444:11434"
    volumes:
      - ./data/ollama_data:/root/.ollama
      - ./ollama-entrypoint.sh:/ollama-entrypoint.sh
    networks:
      - policy_network
    entrypoint: /ollama-entrypoint.sh
    env_file:
      - ./env/.env.dev

  api:
    build: .
    container_name: ada_server
    ports:
      - "8080:8000"
    volumes:
      - ./app:/code/app
      - ./data/client_data:/code/data/client_data
    depends_on:
      - qdrant
      - ollama
    networks:
      - policy_network
    env_file:
      - ./env/.env.dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

networks:
  policy_network:
    driver: bridge